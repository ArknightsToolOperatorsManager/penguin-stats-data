name: Fetch Penguin Statistics Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch Penguin Statistics Data
        run: node scripts/fetch-penguin-stats.js

      - name: Generate distribution data
        run: |
          node scripts/generate-distribution-data.js
          node scripts/generate-active-stages-data.js

      - name: Validate generated distribution data
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const dropsFile = 'data/distribution/penguin_cn_drop_data.json';
          const drops = JSON.parse(fs.readFileSync(dropsFile, 'utf8'));
          if (drops.server !== 'CN') throw new Error('Unexpected drop-data server');
          if (!Number.isInteger(drops.stageCount) || drops.stageCount <= 0) throw new Error('No drop stages generated');
          if (!Number.isInteger(drops.recordCount) || drops.recordCount <= 0) throw new Error('No drop records generated');
          if (!drops.stages || Object.keys(drops.stages).length !== drops.stageCount) throw new Error('Drop stageCount mismatch');

          const activeFile = 'data/distribution/penguin_active_stages.json';
          const active = JSON.parse(fs.readFileSync(activeFile, 'utf8'));
          if (active.schemaVersion !== 1) throw new Error('Unexpected active-stage schema version');
          if (!Number.isInteger(active.graceDays) || active.graceDays < 0) throw new Error('Invalid graceDays');
          for (const server of ['CN', 'US', 'JP', 'KR']) {
            if (!Array.isArray(active.servers?.[server])) throw new Error(`Missing active-stage server: ${server}`);
            for (const stage of active.servers[server]) {
              if (!stage.stageId || !Number.isFinite(stage.start) || !Number.isFinite(stage.end)) {
                throw new Error(`Invalid active-stage record for ${server}`);
              }
            }
          }

          console.log(`Validated drops: ${drops.stageCount} stages / ${drops.recordCount} records`);
          console.log(`Validated active candidates: ${active.totalStageCount} stages`);
          NODE

      - name: Commit source data changes
        run: |
          git config --local user.email "an.manager.tool@gmail.com"
          git config --local user.name "ArknightsTool-MAN"
          git add data/
          if git diff --staged --quiet; then
            echo "No source data changes to commit"
          else
            git commit -m "Update penguin stats data - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi

      - name: Checkout master-data-file
        uses: actions/checkout@v4
        with:
          repository: Memoria-ll/master-data-file
          ref: main
          token: ${{ secrets.MASTER_DATA_REPO_TOKEN }}
          path: master-data-file

      - name: Publish distribution data to master-data-file
        run: |
          install -D \
            data/distribution/penguin_cn_drop_data.json \
            master-data-file/arknights-data/stage/penguin_cn_drop_data.json
          install -D \
            data/distribution/penguin_active_stages.json \
            master-data-file/arknights-data/stage/penguin_active_stages.json

          cd master-data-file
          git config user.email "an.manager.tool@gmail.com"
          git config user.name "ArknightsTool-MAN"
          git add \
            arknights-data/stage/penguin_cn_drop_data.json \
            arknights-data/stage/penguin_active_stages.json

          if git diff --staged --quiet; then
            echo "No distribution data changes to publish"
          else
            git commit -m "Update Penguin stage data - $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi
